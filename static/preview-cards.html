<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vista previa · cartas de ejemplo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .preview-page { max-width: 390px; margin: 0 auto; padding: 16px 14px 48px; }
    .preview-banner { margin: 0 0 18px; font: 600 12px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); text-align: center; }
    .preview-block { margin-bottom: 36px; }
    .job { border-top: 1px solid var(--line-2); padding: 12px 0 4px; }
    .job-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); }
    .job-bullets { margin: 8px 0 0; padding: 0 0 0 18px; }
    .job-bullets li { font-size: 15px; line-height: 1.4; color: var(--ink-2); margin: 0 0 6px; }
    .fields.rich { grid-template-columns: 1fr; }
    .field-extra { font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 2px; }
    .preview-phone .card { padding: 16px; }
    .preview-phone .card-title { font-size: 19px; }
    .preview-phone .btn-row { flex-direction: column; }
    .preview-phone .btn-row .btn { width: 100%; }
    .shot { background: var(--bg); }
    .shot .preview-block { margin: 0; }
    body.shot { background: var(--bg); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./preview-cards.js"></script>
</body>
</html>
